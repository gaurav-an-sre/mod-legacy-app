services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: legacy_shop
      MYSQL_USER: legacy
      MYSQL_PASSWORD: legacy
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  legacy:
    build: ./legacy
    environment:
      DB_HOST: db
      DB_NAME: legacy_shop
      DB_USER: legacy
      DB_PASSWORD: legacy
    depends_on:
      db:
        condition: service_healthy

  fake-candidate:
    build: ./tests/fixtures/fake_candidate
    environment:
      FAKE_DIVERGE: "${FAKE_DIVERGE:-1}"

  candidate-catalog:
    build: ./services/catalog
    environment:
      DB_HOST: db
      DB_NAME: legacy_shop
      DB_USER: legacy
      DB_PASSWORD: legacy
      # legacy = bug-for-bug LIKE (parity); enhanced = ranked Thai-aware search (search-eval).
      SEARCH_MODE: "${SEARCH_MODE:-legacy}"
      SEARCH_SYNONYMS: /search_eval/synonyms.yaml
      SEARCH_TAGS: /search_eval/products.yaml
    volumes:
      - ./search_eval/sawan_mart/synonyms.yaml:/search_eval/synonyms.yaml:ro
      - ./search_eval/sawan_mart/products.yaml:/search_eval/products.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    environment:
      # Storefront page compares the same query across the three paths.
      SHOP_LEGACY_URL: http://legacy:80
      SHOP_CANDIDATE_URL: http://candidate-catalog:8001
      SHOP_FACADE_URL: http://strangler:80
    volumes:
      - .:/workspace

  strangler:
    image: nginx:1.27-alpine
    depends_on:
      - legacy
      - fake-candidate
      - console
    ports:
      - "8080:80"
    volumes:
      - ./strangler/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./strangler/logs:/var/log/nginx

  parity:
    build:
      context: .
      dockerfile: console/Dockerfile
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      LEGACY_URL: http://legacy
      CANDIDATE_URL: http://candidate-catalog:8001
    volumes:
      - .:/workspace
    working_dir: /workspace

volumes:
  db_data:
